apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: certdx-client
    labels:
        app.kubernetes.io/name: certdx
        app.kubernetes.io/component: client
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: certdx-client
subjects:
    - kind: ServiceAccount
      name: certdx-client
      namespace: certdx
