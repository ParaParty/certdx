apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: certdx-kubernetes-updater
    labels:
        app.kubernetes.io/name: certdx
        app.kubernetes.io/component: kubernetes-certificate-updater
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: certdx-kubernetes-updater
subjects:
    - kind: ServiceAccount
      name: certdx-kubernetes-updater
      namespace: certdx
