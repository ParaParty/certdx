apiVersion: batch/v1
kind: CronJob
metadata:
    name: certdx-kubernetes-updater
    namespace: certdx
    labels:
        app.kubernetes.io/name: certdx
        app.kubernetes.io/component: kubernetes-certificate-updater
spec:
    schedule: "0 0,12 * * *"
    timeZone: Asia/Shanghai
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    jobTemplate:
        spec:
            backoffLimit: 1
            activeDeadlineSeconds: 900
            template:
                metadata:
                    labels:
                        app.kubernetes.io/name: certdx
                        app.kubernetes.io/component: kubernetes-certificate-updater
                spec:
                    serviceAccountName: certdx-kubernetes-updater
                    restartPolicy: Never
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 65532
                        runAsGroup: 65532
                        fsGroup: 65532
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: updater
                          image: ${IMAGE}
                          imagePullPolicy: IfNotPresent
                          args:
                              - kubernetes-certificate-updater
                              - --conf=/etc/certdx/client.toml
                          securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                  drop:
                                      - ALL
                              readOnlyRootFilesystem: true
                          resources:
                              requests:
                                  cpu: 50m
                                  memory: 64Mi
                              limits:
                                  cpu: 500m
                                  memory: 512Mi
                          volumeMounts:
                              - name: config
                                mountPath: /etc/certdx
                                readOnly: true
                    volumes:
                        - name: config
                          secret:
                              secretName: certdx-kubernetes-updater-config
                              defaultMode: 0440
