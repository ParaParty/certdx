[Common]
retryCount = 5
# http or grpc
mode = "http"
# only take effect in gRPC mode. If client lost connection from
# main server or standby server, will reconnect to server every
# reconnectInterval. Also, if client fallback to standby server,
# will retry connect to main server every reconnectInterval.
reconnectInterval = "10m"

[Http.MainServer]
url = "https://certdxserver.example.com:19198/1145141919810"
authMethod = "token"
token = "KFCCrazyThursdayVMe50"

# authMethod = "mtls"
# pem = "/path/to/mtls/client-bundle.pem"

[Http.StandbyServer]
url = "http://mybackupserver.local:11451/1919810"

[GRPC.MainServer]
server = "grpc.example.com:9999"
pem = "/path/to/mtls/client-bundle.pem"

[GRPC.StandbyServer]
server = "192.168.1.2:9090"
pem = "/path/to/mtls/client-bundle.pem"

# Named credentials referenced by update actions. Names are scoped per
# profile type, so a tencentCloud and a kubernetes profile may share one.

# [[Profile.TencentCloud]]
# name = "prod"
# secretID = "tencent cloud secret id"
# secretKey = "tencent cloud secret key"
# defaults to ssl.tencentcloudapi.com
# endpoint = "ssl.tencentcloudapi.com"

# [[Profile.Kubernetes]]
# name = "cluster-a"
# empty means in-cluster, then $KUBECONFIG, then ~/.kube/config
# kubeConfig = ""

# Certificate list, indicating which certificates this certdx client
# needs to take over for updates. Every [[Certificate.UpdateAction]]
# belongs to the [[Certificate]] above it.

[[Certificate]]
name = "certFileNameToSave"
domains = [
    "*.example.com",
    "*.mm.example.com",
]

[[Certificate.UpdateAction]]
type = "file"
# will save cert and key file at savePath/name.pem and savePath/name.key
savePath = "/path/to/directory/which/saves/your/certificates"
# command to reload your services, runs only when the files already existed
# reloadCommand = "systemctl reload nginx"
reloadCommand = "bash /opt/acme/reload.sh"

# Re-point Tencent Cloud resources at the renewed certificate.
# [[Certificate.UpdateAction]]
# type = "tencentCloud"
# profile = "prod"
# one of clb, cdn, waf, live, vod, ddos, tke, apigateway, tcb, teo
# resourceTypes = ["teo", "cdn"]
# optional per-resource-type region filter; every resourceType listed
# here must also appear in resourceTypes above
# resourceTypesRegions = [{ resourceType = "clb", regions = ["ap-guangzhou"] }]

# Patch kubernetes.io/tls secrets annotated with
# party.para.certdx/domains whose domains this certificate covers.
# [[Certificate.UpdateAction]]
# type = "kubernetes"
# profile = "cluster-a"

# A certificate may list any number of update actions, and a certificate
# with no file action is never written to disk at all.
[[Certificate]]
name = "cert2"
domains = [
    "*.lulu.com",
    "*.mm.lulu.com",
]

[[Certificate.UpdateAction]]
type = "file"
savePath = "/path/to/directory/which/saves/your/certificates"
reloadCommand = "bash /opt/acme/reload.sh"
